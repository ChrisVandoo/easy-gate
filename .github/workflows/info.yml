name: Info

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  # A standalone workflow is not called by CI, so it builds the plan itself and
  # asks `execute` about its own jobs. Same config, same inputs, same answer.
  plan:
    runs-on: ubuntu-latest
    outputs:
      debug: ${{ steps.debug.outputs.run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Create test plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun .github/scripts/test-plan.ts create \
            --pr "${{ github.event.pull_request.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --out plan.json

      - name: Should debug run?
        id: debug
        run: bun .github/scripts/test-plan.ts execute --plan plan.json --workflow info --job debug

  debug:
    needs: plan
    if: needs.plan.outputs.debug == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Print run attempt
        run: |
          echo "Run attempt: ${{ github.run_attempt }}"

      - name: Print event object
        env:
          EVENT: ${{ toJSON(github.event) }}
        run: echo "$EVENT"
