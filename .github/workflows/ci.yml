name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Enough history to diff against the base of the pull request.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Create test plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR" ]; then
            bun .github/scripts/test-plan.ts create --pr "$PR" --repo "$GITHUB_REPOSITORY"
          else
            bun .github/scripts/test-plan.ts create \
              --event "$GITHUB_EVENT_NAME" \
              --ref "$GITHUB_REF_NAME" \
              --base "$BEFORE"
          fi

  lint:
    needs: plan
    uses: ./.github/workflows/lint.yml
    with:
      plan: ${{ needs.plan.outputs.plan || '{}' }}

  test:
    needs: plan
    uses: ./.github/workflows/test.yml
    with:
      plan: ${{ needs.plan.outputs.plan || '{}' }}
