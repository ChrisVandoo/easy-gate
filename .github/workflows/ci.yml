name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Enough history to diff against the base of the pull request.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Create test plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -n "$PR" ]; then
            bun .github/scripts/test-plan.ts create --pr "$PR" --repo "$GITHUB_REPOSITORY"
            exit 0
          fi

          args=(--event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF_NAME" --default-branch "$DEFAULT_BRANCH")

          # A brand new branch has no `before` commit to diff against.
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            args+=(--base "$BEFORE")
          fi

          bun .github/scripts/test-plan.ts create "${args[@]}"

  lint:
    needs: plan
    if: fromJSON(needs.plan.outputs.plan || '{}').workflows.ci.jobs.lint.run
    uses: ./.github/workflows/lint.yml

  test:
    needs: plan
    if: fromJSON(needs.plan.outputs.plan || '{}').workflows.ci.jobs.test.run
    uses: ./.github/workflows/test.yml

  # The only required check. It passes when the run did exactly what the plan
  # asked for: every planned job succeeded, and every job the plan ruled out
  # was skipped. Any job named in .github/test-plan.yaml must appear in `needs`
  # here, or the check fails saying so.
  required:
    needs: [plan, lint, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify the plan was carried out
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$PLAN" |
            bun .github/scripts/test-plan.ts verify --plan - --workflow ci --results "$RESULTS"
