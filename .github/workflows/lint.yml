name: Lint

on:
  workflow_call:
    inputs:
      plan:
        description: >-
          The test plan, as JSON. The caller builds it; the `lint` workflow
          in it decides the jobs below, and the gate checks them against it.
        type: string
        required: true

jobs:
  lint:
    if: fromJSON(inputs.plan).workflows.lint.jobs.lint.run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  verify:
    needs: [lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify the plan was carried out
        env:
          PLAN: ${{ inputs.plan }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$PLAN" |
            bun .github/scripts/test-plan.ts verify --plan - --workflow lint --results "$RESULTS"
