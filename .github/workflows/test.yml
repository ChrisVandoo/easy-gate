name: Test

on:
  workflow_call:
    inputs:
      plan:
        description: >-
          The test plan, as JSON. The caller builds it; the `test` workflow
          in it decides the jobs below, and the gate checks them against it.
        type: string
        required: true

jobs:
  test:
    if: fromJSON(inputs.plan).workflows.test.jobs.test.run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test

  # A called workflow carries its own gate. The caller's `needs` context only
  # ever holds this workflow's overall result, never the jobs inside it, so the
  # caller cannot check them — this job does, and a mismatch surfaces upward as
  # this workflow failing.
  verify:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify the plan was carried out
        env:
          PLAN: ${{ inputs.plan }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$PLAN" |
            bun .github/scripts/test-plan.ts verify --plan - --workflow test --results "$RESULTS"
